[package]
name = "arena-nova"
version = "0.8.0"
description = "Arena Nova — overgrown sanctuary"
authors = ["Arena Nova"]
edition = "2021"
rust-version = "1.77.2"

# The library is what enables mobile (iOS/Android) targets in Tauri v2 while
# the same code powers the desktop binary.
[lib]
name = "arena_nova_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# In-app updates: check GitHub releases, download and relaunch.
[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[features]
# This feature is used for production builds where `devUrl` is disabled.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"   # optimize for size
lto = true         # link-time optimization
codegen-units = 1
panic = "abort"
strip = true

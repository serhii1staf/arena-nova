<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0f0a" />
    <title>Arena Nova — Overgrown Sanctuary</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #06090a;
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto,
          sans-serif;
        color: #dfe9dc;
        -webkit-user-select: none;
        user-select: none;
        touch-action: none;
        overscroll-behavior: none;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
      }

      /* ---- Loading overlay ---- */
      #loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: radial-gradient(
          circle at 50% 40%,
          #12351f 0%,
          #0a1a12 45%,
          #05090a 100%
        );
        z-index: 10;
        transition: opacity 0.9s ease;
      }
      #loader.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .brand {
        font-size: clamp(28px, 6vw, 52px);
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        background: linear-gradient(180deg, #eafff0 0%, #7fd18a 60%, #3f8f57 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        text-shadow: 0 0 40px rgba(120, 220, 140, 0.25);
      }
      .brand small {
        display: block;
        margin-top: 8px;
        font-size: clamp(10px, 1.6vw, 13px);
        letter-spacing: 0.5em;
        font-weight: 500;
        color: #6f9a78;
        -webkit-text-fill-color: #6f9a78;
      }
      .bar {
        width: min(320px, 60vw);
        height: 4px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }
      .bar > i {
        display: block;
        height: 100%;
        width: 0%;
        border-radius: 4px;
        background: linear-gradient(90deg, #4f9e63, #a6f0b4);
        box-shadow: 0 0 16px rgba(140, 240, 160, 0.6);
        transition: width 0.25s ease;
      }
      #loaderStatus {
        font-size: 12px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #6f9a78;
        min-height: 14px;
      }

      /* ---- Scene-transition fade (hides the build hitch) ---- */
      #fade {
        position: fixed;
        inset: 0;
        background: #05090a;
        opacity: 0;
        pointer-events: none;
        z-index: 8;
        transition: opacity 0.26s ease;
      }
      #fade.on {
        opacity: 1;
      }
      /*
       * Transition indicator. Lives *inside* #fade so it inherits the group
       * opacity: it appears and disappears with the screen for free, with no
       * second animation to keep in sync. Hidden until the file loads, so a
       * missing asset leaves a plain dark screen rather than a broken icon.
       */
      #fadeIcon {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: clamp(88px, 13vmin, 152px);
        height: auto;
        display: none;
      }
      #fadeIcon.ready {
        display: block;
      }

      /* ================= Player list (hold Tab) ================= */
      #players {
        position: fixed;
        top: 64px;
        right: 18px;
        /* Above the canvas. At 7 it sat under it, and the compositor hit-tested the
           canvas first — so the invite button could not be clicked even with
           `pointer-events` restored on it. The panel itself stays pass-through; only
           the button takes the pointer. */
        z-index: 40;
        width: 268px;
        max-height: 62vh;
        overflow: hidden auto;
        padding: 10px;
        border: 1px solid rgba(120, 200, 150, 0.18);
        border-radius: 14px;
        background: rgba(6, 18, 12, 0.82);
        backdrop-filter: blur(6px);
        opacity: 0;
        transform: translateX(14px);
        pointer-events: none;
        transition:
          opacity 0.16s ease,
          transform 0.16s ease;
      }
      #players.on {
        opacity: 1;
        transform: none;
      }
      #playersHead {
        display: flex;
        justify-content: space-between;
        margin: 2px 4px 8px;
        font-size: 10px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(150, 200, 165, 0.7);
      }
      .playerRow {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 6px;
        border-radius: 10px;
      }
      .playerRow.self {
        background: rgba(90, 200, 130, 0.12);
      }
      /*
       * The character portrait: an actual front view of the model that player is
       * wearing, rendered once per character and reused by every row wearing it.
       * There are only seven characters and a portrait never changes, so this is a
       * handful of one-off 64x64 draws for the whole session — see
       * src/ui/Portraits.ts.
       *
       * No frame, no plate, no ring. The render already has a transparent
       * background, so the face can sit directly on the row — and it should: at
       * 30 px the ring and the dark plate behind it were eating the outer few
       * pixels of a picture that is mostly face, which is the part carrying all the
       * information. The accent colour is still available per row for the fallback
       * chip, which does need a fill to be legible.
       *
       * Larger than the chip it replaces, and nudged inward, because the figure no
       * longer has to leave room for a border.
       */
      .portrait {
        flex: 0 0 auto;
        width: 34px;
        height: 34px;
        margin-left: 3px;
        margin-right: 1px;
        /* `contain`, not `cover`: the render is framed head-and-shoulders already
           and cropping it to fill a square cuts the top of the head off. */
        object-fit: contain;
        /* Lifts the figure off a dark row without drawing a box around it. */
        filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.55));
      }
      /*
       * Fallback for the moment before a portrait has been rendered, and for a
       * build with no authored models. Same footprint, so nothing shifts when the
       * picture lands.
       */
      .chip {
        display: grid;
        flex: 0 0 auto;
        place-items: center;
        /* Matches the portrait's footprint including its margins, so a row does not
           shift sideways the moment the picture arrives. */
        width: 34px;
        height: 34px;
        margin-left: 3px;
        margin-right: 1px;
        border-radius: 10px;
        background: var(--chip, #2c6b46);
        color: #06180e;
        font-size: 14px;
        font-weight: 700;
      }
      .playerName {
        flex: 1 1 auto;
        overflow: hidden;
        font-size: 13px;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: #cfeedd;
      }
      .adminTag {
        padding: 1px 6px;
        border-radius: 5px;
        background: rgba(255, 196, 90, 0.22);
        color: #ffd591;
        font-size: 9px;
        letter-spacing: 0.12em;
      }
      .playerPing {
        flex: 0 0 auto;
        font-size: 11px;
        font-variant-numeric: tabular-nums;
        color: rgba(160, 210, 175, 0.8);
      }
      /* Four bars, filled according to latency. */
      .bars {
        display: flex;
        flex: 0 0 auto;
        align-items: flex-end;
        gap: 2px;
        height: 12px;
      }
      .bars i {
        width: 3px;
        border-radius: 1px;
        background: rgba(140, 190, 160, 0.22);
      }
      .bars i:nth-child(1) {
        height: 4px;
      }
      .bars i:nth-child(2) {
        height: 7px;
      }
      .bars i:nth-child(3) {
        height: 10px;
      }
      .bars i:nth-child(4) {
        height: 12px;
      }
      .bars.lit1 i:nth-child(-n + 1),
      .bars.lit2 i:nth-child(-n + 2),
      .bars.lit3 i:nth-child(-n + 3),
      .bars.lit4 i:nth-child(-n + 4) {
        background: #7fe0a4;
      }
      .bars.lit1 i:nth-child(-n + 1) {
        background: #e8955f;
      }
      .bars.offline i {
        background: rgba(230, 110, 90, 0.5);
      }

      /* ================= Squad ================= */
      #squad {
        position: fixed;
        top: 58px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 21;
        display: none;
        min-width: 150px;
        padding: 6px 10px;
        border: 1px solid rgba(90, 200, 130, 0.18);
        border-radius: 10px;
        background: rgba(6, 18, 12, 0.6);
        pointer-events: none;
      }
      #squad.on {
        display: block;
      }
      .squadRow {
        display: flex;
        gap: 10px;
        align-items: center;
        justify-content: space-between;
        font-size: 12px;
      }
      .squadName {
        overflow: hidden;
        color: #cfeedd;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .squadFar {
        color: rgba(143, 227, 176, 0.9);
        font-variant-numeric: tabular-nums;
      }
      .inviteKeys {
        margin-top: 3px;
        color: rgba(143, 227, 176, 0.75);
        font-size: 10px;
      }
      /* --- Build hotbar (admin) ------------------------------------------------
         Centred along the bottom, the way every game that has one puts it. Shown
         only while build mode is on, and only for an admin: `hidden` is set from
         script, so a normal session never renders any of this. */
      #buildHud {
        position: fixed;
        left: 50%;
        bottom: 18px;
        transform: translateX(-50%);
        /* Above the canvas. The canvas hit-tests first, so without this the slots
           cannot be clicked even once the cursor is free. */
        z-index: 45;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 7px;
        pointer-events: none;
      }
      #buildHud[hidden] {
        display: none;
      }
      #buildBar {
        display: flex;
        gap: 7px;
        /* The bar takes the pointer; the column around it stays pass-through so it
           never eats a click aimed at the world. */
        pointer-events: auto;
      }
      .buildSlot {
        position: relative;
        /* Ten slots across, so they are sized to fit a narrow window rather than to
           look generous on a wide one. */
        width: 52px;
        height: 52px;
        padding: 0;
        border: 1px solid rgba(150, 190, 230, 0.22);
        border-radius: 10px;
        background: rgba(10, 16, 26, 0.72);
        color: #cfe0f2;
        font: inherit;
        cursor: pointer;
        /* No transition, deliberately.
           A transition is the one thing that can make a slot's computed style lag
           the class that owns it, and the slot row is rebuilt whenever you switch
           groups — so a freshly inserted button could be left showing the previous
           selection's styling while a different slot held the class. Measured: the
           chosen slot reported an unchanged border for a quarter of a second. The
           animation was worth nothing; being correct on the frame the piece changes
           is worth a lot. */
      }
      .buildSlot:hover {
        border-color: rgba(150, 190, 230, 0.5);
      }
      /* Deliberately no `transform` here.
         Lifting the chosen slot looked good and behaved badly: the slot row is
         rebuilt when you switch groups, and a transform on a freshly inserted
         element is a compositor-only property, so it could sit a frame behind the
         class that owns it — leaving one square raised while a different one was
         actually chosen. Border, fill and glow all affect nothing but paint of the
         element itself and cannot disagree with the class list. */
      .buildSlot.on {
        border-color: rgba(126, 224, 168, 0.9);
        background: rgba(20, 52, 34, 0.92);
        box-shadow:
          0 0 0 1px rgba(126, 224, 168, 0.45),
          0 0 12px rgba(90, 240, 140, 0.25);
      }
      /* --- Inventory, crafting, vitals ---------------------------------------- */
      /* One centred window rather than three columns spread across the screen, laid out
         the way a survival game's inventory is: the character on the left with their
         condition under them, what can be made on the right, and the bag itself as a
         fixed grid of square slots along the bottom — including the empty ones, because
         seeing how much room is left is half of what an inventory is for. */
      #inventory {
        position: fixed;
        inset: 0;
        z-index: 70;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(4, 8, 14, 0.66);
        backdrop-filter: blur(6px);
      }
      #inventory.on {
        display: flex;
      }
      /*
       * Three columns, the way a survival game's inventory is laid out: who you are on the
       * left, what you are carrying in the middle, and what you can do with it on the
       * right, with your condition in the bottom corner.
       *
       * The previous arrangement put the bag in a full-width strip along the bottom, which
       * meant the grid was as wide as the window and only three rows tall — so the thing
       * being looked at most was the thing shaped least like a bag. Standing the grid up in
       * its own column gives it the square proportions it wants and leaves both side panels
       * full height.
       */
      .invWindow {
        display: grid;
        width: min(1420px, 97vw);
        height: min(880px, 95vh);
        gap: 10px;
        grid-template:
          'you bag craft' minmax(0, 1fr)
          'you bag vitals' min-content / minmax(220px, 320px) auto minmax(300px, 1fr);
        padding: 14px;
        border: 1px solid rgba(150, 190, 230, 0.16);
        border-radius: 10px;
        background: rgba(11, 15, 21, 0.96);
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.55);
      }
      .invPane {
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-width: 0;
        min-height: 0;
        padding: 12px;
        border: 1px solid rgba(150, 190, 230, 0.1);
        border-radius: 7px;
        background: rgba(17, 22, 30, 0.9);
      }
      .invYou {
        grid-area: you;
      }
      .invWide {
        grid-area: craft;
      }
      .invBag {
        grid-area: bag;
      }
      /*
       * Condition in the bottom corner, as three coloured bars with their values on them.
       *
       * Under the character it was a row of labelled grey tracks that read as form fields.
       * Colour is what makes these legible at a glance — green for health, blue for water,
       * amber for food — and the number belongs on the bar rather than beside it, because
       * the bar is the thing the eye goes to.
       */
      .invVitals {
        grid-area: vitals;
        gap: 6px;
        padding: 10px 12px;
      }
      .invHead {
        display: flex;
        gap: 8px;
        align-items: baseline;
        justify-content: space-between;
        padding-bottom: 8px;
        border-bottom: 1px solid rgba(150, 190, 230, 0.14);
      }
      .invTitle {
        color: rgba(190, 215, 240, 0.72);
        font-size: 11px;
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }
      .invSlots {
        overflow: hidden;
        color: rgba(170, 200, 225, 0.55);
        font-size: 10px;
        text-align: right;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      /* The figure gets the room that is left, and is centred in it. A fixed height
         would either crop a tall character or float a short one. */
      .invBody {
        display: flex;
        overflow: hidden;
        flex: 1;
        align-items: center;
        justify-content: center;
        min-height: 0;
        border-radius: 10px;
        background:
          radial-gradient(ellipse at 50% 82%, rgba(120, 190, 240, 0.14), transparent 62%),
          rgba(8, 13, 21, 0.7);
      }
      .invBody img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
      }
      /* Eight across, three down: the twenty-four slots the bag actually holds, drawn
         whether or not there is anything in them. */
      /* Slots are a fixed size rather than a share of the width. Stretched to fill, three
         rows of them ate most of the window and squeezed the character and the recipes
         into a strip along the top. */
      /* Six across, four down: the twenty-four slots the bag holds, in a block that reads
         as a bag rather than as a strip. */
      /*
       * Columns that cap rather than fix, so the bag gives ground before the panel beside it
       * does. At a fixed 76 px the grid claimed its width unconditionally and on a narrow
       * window the crafting column was squeezed until every recipe subtitle was an ellipsis.
       * The cells keep their square shape from `aspect-ratio`, so shrinking the track shrinks
       * the cell without distorting it.
       */
      #invGrid {
        display: grid;
        gap: 5px;
        grid-template-columns: repeat(6, minmax(46px, 76px));
        justify-content: center;
      }
      /* Filled slots are lifted well clear of the empty ones. Against a dark panel a
         timber icon on a dark square is hard to pick out, so the square a thing is in gets
         a lighter face and a brighter edge — the contrast carries the reading, not the
         icon fighting the background. */
      .invCell {
        position: relative;
        aspect-ratio: 1;
        padding: 2px;
        border: 1px solid rgba(170, 205, 240, 0.28);
        border-radius: 4px;
        background: linear-gradient(180deg, rgba(52, 62, 78, 0.95), rgba(34, 42, 54, 0.95));
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
      }
      .invCell.empty {
        border-style: dashed;
        border-color: rgba(150, 190, 230, 0.07);
        background: rgba(15, 19, 26, 0.7);
      }
      .invCell.edible {
        border-color: rgba(190, 120, 140, 0.4);
        cursor: pointer;
      }
      .invCell.edible:hover {
        background: rgba(52, 24, 32, 0.85);
      }
      .invCell.placeable {
        border-color: rgba(126, 224, 168, 0.4);
        cursor: pointer;
      }
      .invCell.placeable:hover {
        background: rgba(20, 48, 32, 0.85);
      }
      .invIcon {
        width: 100%;
        height: 74%;
        object-fit: contain;
      }
      .invCount {
        position: absolute;
        top: 3px;
        right: 6px;
        color: #dceaf8;
        font-size: 11px;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9);
      }
      .invName {
        display: block;
        overflow: hidden;
        color: rgba(180, 205, 230, 0.75);
        font-size: 9px;
        text-align: center;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .invEmpty {
        grid-column: 1 / -1;
        padding: 18px 4px;
        color: rgba(170, 195, 220, 0.5);
        font-size: 12px;
        text-align: center;
      }
      #invRecipes {
        display: flex;
        overflow: hidden auto;
        flex: 1;
        flex-direction: column;
        gap: 6px;
      }
      .invRecipe {
        position: relative;
        display: flex;
        gap: 9px;
        align-items: center;
        padding: 7px 9px;
        border: 1px solid rgba(126, 224, 168, 0.35);
        border-radius: 10px;
        background: rgba(14, 30, 22, 0.8);
        color: #d7ecff;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      .invRecipe:hover:not(:disabled) {
        border-color: rgba(126, 224, 168, 0.75);
      }
      /* Blocked, not hidden. Seeing what you cannot make yet is how you learn what to
         look for; hiding it makes the list change shape as you walk around. */
      .invRecipe.blocked {
        border-color: rgba(150, 190, 230, 0.14);
        background: rgba(14, 20, 30, 0.7);
        color: rgba(180, 205, 230, 0.55);
        cursor: default;
      }
      .invRecipeIcon {
        width: 34px;
        height: 34px;
        object-fit: contain;
      }
      .invRecipeText {
        display: flex;
        flex: 1;
        flex-direction: column;
        min-width: 0;
      }
      .invRecipeName {
        font-size: 13px;
      }
      .invRecipeNeeds {
        overflow: hidden;
        color: rgba(170, 200, 225, 0.66);
        font-size: 10px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .invRecipeTag {
        flex: 0 0 auto;
        color: rgba(150, 200, 175, 0.7);
        font-size: 9px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }
      .invBar {
        position: absolute;
        right: 9px;
        bottom: 2px;
        left: 9px;
        height: 2px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.07);
      }
      .invBarFill {
        display: block;
        width: 0;
        height: 100%;
        border-radius: 2px;
        background: #7ee0a8;
      }
      .invBars {
        display: flex;
        width: 100%;
        flex-direction: column;
        gap: 5px;
      }
      .invMeterRow {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .invMeterLabel {
        flex: 0 0 18px;
        color: rgba(200, 220, 240, 0.8);
        font-size: 13px;
        text-align: center;
      }
      .invMeter {
        position: relative;
        display: block;
        overflow: hidden;
        flex: 1;
        height: 19px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.07);
      }
      .invMeterFill {
        display: block;
        width: 100%;
        height: 100%;
        border-radius: 3px;
      }
      /*
       * The value, printed on the bar rather than beside it.
       *
       * Positioned over the track and not over the fill, so the number holds still while the
       * bar moves. Sitting it inside the fill would slide the text along with the level and,
       * at a low level, clip it away entirely.
       */
      .invMeterValue {
        position: absolute;
        top: 0;
        right: 7px;
        color: rgba(12, 18, 14, 0.9);
        font-size: 11px;
        font-variant-numeric: tabular-nums;
        font-weight: 700;
        line-height: 19px;
        text-shadow: 0 1px 0 rgba(255, 255, 255, 0.28);
      }
      .invMeterFill.health {
        background: linear-gradient(90deg, #4d9b57, #7ed08a);
      }
      .invMeterFill.water {
        background: linear-gradient(90deg, #3f86c6, #74c2ea);
      }
      .invMeterFill.food {
        background: linear-gradient(90deg, #c07a2c, #e8a75a);
      }

      /* Interaction prompt, just below the crosshair where the eye already is. */
      #interactHint {
        position: fixed;
        left: 50%;
        top: calc(50% + 34px);
        transform: translateX(-50%);
        z-index: 44;
        padding: 3px 11px;
        border: 1px solid rgba(255, 226, 150, 0.35);
        border-radius: 8px;
        background: rgba(10, 12, 8, 0.55);
        color: #ffe9a8;
        font-size: 12px;
        letter-spacing: 0.02em;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
        pointer-events: none;
      }
      #interactHint[hidden] {
        display: none;
      }
      /* Group tabs. Twenty pieces will not fit on one row a hand can reach across,
         so the bar shows one group and these switch between them. */
      #buildCats {
        display: flex;
        gap: 5px;
        pointer-events: auto;
      }
      .buildCat {
        padding: 3px 11px;
        border: 1px solid rgba(150, 190, 230, 0.2);
        border-radius: 7px;
        background: rgba(10, 16, 26, 0.66);
        color: rgba(190, 215, 240, 0.72);
        font: inherit;
        font-size: 11px;
        letter-spacing: 0.02em;
        cursor: pointer;
        /* No transition, for the same reason the slots have none: it left the tab of
           the *previous* group looking active while the bar below already showed the
           new one. */
      }
      .buildCat:hover {
        border-color: rgba(150, 190, 230, 0.45);
      }
      .buildCat.on {
        border-color: rgba(126, 224, 168, 0.75);
        background: rgba(18, 44, 30, 0.85);
        color: #a9f0c6;
      }
      /* The piece in hand, named once above the bar rather than once in every slot.
         Reserves its own line so the bar does not shift as the name changes. */
      #buildLabel {
        min-height: 17px;
        padding: 1px 12px;
        border-radius: 8px;
        background: rgba(8, 14, 22, 0.55);
        color: #d7ecff;
        font-size: 13px;
        letter-spacing: 0.03em;
        /* The block is centred by the column's `align-items`, but a name shorter
           than the box still has to be centred *inside* it. */
        text-align: center;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.7);
      }
      .buildIcon {
        position: absolute;
        inset: 5px;
        background-position: center;
        background-repeat: no-repeat;
        background-size: contain;
      }
      .buildKey {
        position: absolute;
        top: 2px;
        left: 5px;
        color: rgba(180, 205, 230, 0.6);
        font-size: 9px;
      }
      #buildTip {
        padding: 3px 9px;
        border-radius: 7px;
        background: rgba(8, 14, 22, 0.6);
        color: rgba(176, 200, 224, 0.72);
        font-size: 10px;
        white-space: nowrap;
      }
      #buildCount {
        color: #a9f0c6;
      }
      #buildAim:not(:empty) {
        margin-left: 6px;
        padding-left: 8px;
        border-left: 1px solid rgba(255, 209, 102, 0.35);
        color: #ffd166;
      }
      /* Squad name tags over the world. The layer covers the screen and is inert;
         each tag is placed by transform, which costs no layout. */
      #squadTags {
        position: fixed;
        inset: 0;
        z-index: 38;
        overflow: hidden;
        pointer-events: none;
      }
      .squadTag {
        position: absolute;
        top: 0;
        left: 0;
        display: flex;
        gap: 6px;
        align-items: baseline;
        padding: 2px 8px;
        border: 1px solid rgba(126, 224, 168, 0.4);
        border-radius: 8px;
        background: rgba(6, 20, 12, 0.55);
        white-space: nowrap;
        will-change: transform;
      }
      /* Their face, so a teammate is recognisable at a distance where the character
         itself is only a few pixels tall. */
      .squadTagFace {
        width: 20px;
        height: 20px;
        align-self: center;
        border-radius: 4px;
        object-fit: cover;
      }
      .squadTagFace[hidden] {
        display: none;
      }
      .squadTagName {
        color: #b6f5cf;
        font-size: 12px;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.85);
      }
      .squadTagFar {
        color: rgba(150, 220, 180, 0.8);
        font-size: 10px;
      }
      #squadInvites {
        position: fixed;
        right: 16px;
        bottom: 16px;
        /* Above the canvas, which otherwise swallows the click when the cursor is
           free. The keyboard path exists because while the mouse is captured there
           is no cursor to click with at all. */
        z-index: 60;
        display: none;
        flex-direction: column;
        gap: 8px;
      }
      #squadInvites.on {
        display: flex;
      }
      .inviteCard {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 8px 10px;
        border: 1px solid rgba(90, 200, 130, 0.28);
        border-radius: 10px;
        background: rgba(8, 22, 14, 0.9);
        color: #cfeedd;
        font-size: 12px;
      }
      .inviteText {
        max-width: 170px;
      }
      .inviteBtn {
        padding: 5px 9px;
        border: 1px solid rgba(90, 200, 130, 0.3);
        border-radius: 7px;
        background: rgba(10, 30, 18, 0.9);
        color: #cfeedd;
        font: inherit;
        font-size: 11px;
        cursor: pointer;
      }
      .inviteBtn.yes {
        border-color: rgba(90, 200, 130, 0.7);
        background: rgba(24, 74, 44, 0.95);
      }
      .inviteBtn:hover {
        background: rgba(30, 80, 48, 0.95);
      }
      .rowInvite {
        /* The panel itself is `pointer-events: none` — it is an overlay over the
           view and must not swallow the mouse. That was right while the list was
           purely something to read, and became a bug the moment it grew a button:
           the button inherited the pass-through and could not be clicked at all.
           Restored here and only here, so the clickable area is the button and
           nothing else about the overlay changes. */
        pointer-events: auto;
        padding: 2px 7px;
        border: 1px solid rgba(90, 200, 130, 0.28);
        border-radius: 6px;
        background: transparent;
        color: rgba(207, 238, 221, 0.9);
        font: inherit;
        font-size: 10px;
        cursor: pointer;
      }
      .rowInvite:hover {
        background: rgba(90, 200, 130, 0.16);
      }

      /* ================= Coordinates (F3) + compass ================= */
      #coords {
        position: fixed;
        bottom: 18px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 22;
        display: none;
        padding: 8px 12px;
        border: 1px solid rgba(90, 200, 130, 0.2);
        border-radius: 10px;
        background: rgba(6, 18, 12, 0.72);
        text-align: center;
      }
      #coords.on {
        display: block;
      }
      #coordsRead {
        color: #cfeedd;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.04em;
      }
      #coordsInput {
        width: 200px;
        margin-top: 7px;
        padding: 6px 9px;
        border: 1px solid rgba(90, 200, 130, 0.22);
        border-radius: 7px;
        background: rgba(4, 14, 9, 0.7);
        color: #cfeedd;
        font: inherit;
        font-size: 11px;
        text-align: center;
        outline: none;
      }
      #compass {
        position: fixed;
        top: 14px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 22;
        display: none;
        text-align: center;
        /* Never intercepts the pointer: it sits over the view, not over the UI. */
        pointer-events: none;
      }
      #compass.on {
        display: block;
      }
      #compassNeedle {
        color: #8fe3b0;
        font-size: 20px;
        line-height: 1;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.7);
        /* Rotation is written per frame, so keep it on its own compositor layer. */
        will-change: transform;
      }
      #compassRange {
        margin-top: 2px;
        color: rgba(207, 238, 221, 0.85);
        font-size: 11px;
        font-variant-numeric: tabular-nums;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.7);
      }

      /* ================= Admin panel (P) ================= */
      #admin {
        position: fixed;
        top: 50%;
        left: 18px;
        z-index: 9;
        width: 250px;
        max-height: 76vh;
        overflow: hidden auto;
        padding: 12px;
        transform: translateY(-50%);
        border: 1px solid rgba(255, 196, 90, 0.28);
        border-radius: 14px;
        background: rgba(20, 14, 4, 0.9);
        backdrop-filter: blur(6px);
        display: none;
      }
      #admin.on {
        display: block;
      }
      #adminHead {
        margin: 0 2px 10px;
        font-size: 10px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #ffd591;
      }
      #adminList {
        display: grid;
        gap: 5px;
      }
      .adminBtn {
        padding: 7px 9px;
        border: 1px solid rgba(255, 196, 90, 0.2);
        border-radius: 8px;
        background: rgba(255, 196, 90, 0.06);
        color: #f6e2bd;
        font: inherit;
        font-size: 12px;
        text-align: left;
        cursor: pointer;
      }
      .adminBtn:hover {
        background: rgba(255, 196, 90, 0.16);
      }
      .adminBtn.active {
        border-color: rgba(255, 196, 90, 0.7);
        background: rgba(255, 196, 90, 0.24);
      }
      .adminBtn small {
        display: block;
        color: rgba(246, 226, 189, 0.55);
        font-size: 10px;
      }

      /* ---- HUD ---- */
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 5;
        opacity: 0;
        transition: opacity 0.6s ease;
      }
      #hud.visible {
        opacity: 1;
      }
      #crosshair {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 6px;
        height: 6px;
        margin: -3px 0 0 -3px;
        border-radius: 50%;
        background: rgba(230, 255, 235, 0.55);
        box-shadow: 0 0 6px rgba(180, 255, 200, 0.5);
      }
      #stats {
        position: absolute;
        top: 10px;
        left: 12px;
        font-variant-numeric: tabular-nums;
        font-size: 12px;
        letter-spacing: 0.06em;
        color: rgba(200, 230, 205, 0.7);
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.7);
        white-space: pre;
      }
      #hint {
        position: absolute;
        left: 50%;
        bottom: 26px;
        transform: translateX(-50%);
        font-size: 13px;
        letter-spacing: 0.08em;
        color: rgba(210, 235, 214, 0.85);
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
        background: rgba(6, 14, 9, 0.35);
        padding: 8px 16px;
        border-radius: 999px;
        backdrop-filter: blur(6px);
        border: 1px solid rgba(140, 200, 150, 0.15);
        transition: opacity 0.5s ease;
      }

      /* ================= Shared UI kit ================= */
      .panel {
        background: rgba(10, 22, 15, 0.62);
        border: 1px solid rgba(150, 220, 165, 0.18);
        border-radius: 18px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      }
      .btn {
        appearance: none;
        border: 1px solid rgba(150, 225, 165, 0.28);
        background: linear-gradient(180deg, rgba(60, 140, 85, 0.9), rgba(32, 92, 55, 0.9));
        color: #eafff0;
        font: inherit;
        font-size: 15px;
        letter-spacing: 0.06em;
        padding: 12px 26px;
        border-radius: 999px;
        cursor: pointer;
        transition: transform 0.14s ease, filter 0.14s ease, background 0.2s ease;
      }
      .btn:hover {
        filter: brightness(1.15);
        transform: translateY(-1px);
      }
      .btn:active {
        transform: translateY(1px);
      }
      .btn.ghost {
        background: rgba(255, 255, 255, 0.06);
        border-color: rgba(180, 220, 190, 0.22);
      }
      .btn.big {
        font-size: 19px;
        letter-spacing: 0.22em;
        padding: 16px 62px;
        text-transform: uppercase;
      }

      /* While the mouse is captured the pointer must be invisible. Asking the OS
         to hide it is unreliable inside a WebView2 window, because the webview
         child window keeps setting its own cursor — so hide it in CSS, which the
         page fully controls. */
      html.mouse-captured,
      html.mouse-captured * {
        cursor: none !important;
      }

      /* Invisible strip along the top used to drag the frameless window.
         It deliberately stops short of the right-hand corner: the window buttons
         live there, and a drag region swallows mousedown before it can become a
         click. That is why those buttons only responded near their outer edge —
         the strip covered the top 26px of each 30px button. z-index alone would
         not have fixed it, because app-region is hit-tested by the compositor
         rather than by CSS stacking. */
      .dragStrip {
        position: absolute;
        top: 0;
        left: 0;
        right: 170px;
        height: 40px;
        z-index: 2;
        -webkit-app-region: drag;
        app-region: drag;
      }

      /* ================= Start screen ================= */
      #start {
        position: fixed;
        inset: 0;
        z-index: 12;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 30px;
        background:
          radial-gradient(circle at 50% 32%, rgba(84, 190, 120, 0.22) 0%, rgba(0, 0, 0, 0) 60%),
          linear-gradient(170deg, #0e2b1a 0%, #0a1c13 48%, #050b09 100%);
        transition: opacity 0.7s ease;
      }
      #start.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #start .brand {
        margin-bottom: 4px;
        transition:
          transform 0.75s cubic-bezier(0.22, 1, 0.36, 1),
          opacity 0.5s ease;
      }
      #startHint {
        font-size: 12px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: rgba(150, 200, 165, 0.65);
        transition:
          transform 0.75s cubic-bezier(0.22, 1, 0.36, 1),
          opacity 0.5s ease;
      }
      /*
       * Once the world is built the two labels get out of the way — the title
       * upward, the prompt downward — and the button becomes the name form. The
       * button is never removed and never replaced: it is the same element the
       * whole time, so the layout does not jump and the click target stays put.
       */
      #start.ready .brand {
        transform: translateY(-56px);
      }
      #start.ready #startHint {
        transform: translateY(52px);
        opacity: 0;
      }

      /* ---- Loading spinner, and the one beside the play button ---- */
      .spinner {
        width: 18px;
        height: 18px;
        flex: 0 0 auto;
        border: 2px solid rgba(150, 220, 175, 0.25);
        border-top-color: rgba(180, 245, 200, 0.95);
        border-radius: 50%;
        animation: spin 0.85s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      /* Respect a user who has asked for less motion. */
      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation-duration: 3s;
        }
        #start .brand,
        #start #startHint,
        #playRow {
          transition: none;
        }
      }

      /* ---- The button, and what it becomes ---- */
      #playRow {
        display: flex;
        align-items: center;
        gap: 12px;
        transition: transform 0.75s cubic-bezier(0.22, 1, 0.36, 1);
      }
      #start.ready #playRow {
        transform: translateY(-6px);
      }
      #nameField {
        display: none;
        align-items: center;
        gap: 10px;
        padding: 0 4px 0 16px;
        border: 1px solid rgba(120, 210, 150, 0.3);
        border-radius: 999px;
        background: rgba(8, 26, 16, 0.72);
      }
      #start.ready #nameField {
        display: flex;
      }
      #nameInput {
        width: 190px;
        padding: 13px 0;
        border: 0;
        background: transparent;
        color: #d7f3e0;
        font: inherit;
        font-size: 15px;
        letter-spacing: 0.04em;
        outline: none;
      }
      #passField {
        margin-top: 10px;
      }
      #passInput {
        width: 232px;
        padding: 9px 12px;
        border: 1px solid rgba(90, 200, 130, 0.22);
        border-radius: 9px;
        background: rgba(6, 20, 12, 0.55);
        color: #cfeedd;
        font: inherit;
        font-size: 12px;
        text-align: center;
        outline: none;
      }
      #passInput:focus {
        border-color: rgba(90, 200, 130, 0.5);
      }
      #passInput::placeholder {
        color: rgba(150, 200, 165, 0.38);
      }
      #nameInput::placeholder {
        color: rgba(150, 200, 165, 0.5);
      }
      #nameNote {
        min-height: 16px;
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: rgba(255, 170, 120, 0.9);
        opacity: 0;
        transition: opacity 0.25s ease;
      }
      #nameNote.on {
        opacity: 1;
      }
      #version {
        position: fixed;
        right: 16px;
        bottom: 14px;
        font-size: 11px;
        letter-spacing: 0.12em;
        color: rgba(160, 200, 170, 0.5);
      }

      /* ================= Pause menu ================= */
      #pause {
        position: fixed;
        inset: 0;
        z-index: 11;
        display: none;
        align-items: center;
        justify-content: center;
      }
      #pause.open {
        display: flex;
      }
      /* The blur lives in its own layer BEHIND the card. Keeping the interactive
         card out of a backdrop-filtered ancestor avoids hit-testing going through
         a composited filter layer, which can swallow clicks. */
      #pauseBlur {
        position: absolute;
        inset: 0;
        backdrop-filter: blur(14px) saturate(0.9) brightness(0.72);
        background: rgba(6, 16, 11, 0.28);
        pointer-events: none;
      }
      #pauseCard {
        position: relative; /* sits above #pauseBlur */
        z-index: 1;
        width: min(560px, 92vw);
        padding: 30px 34px 26px;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      #pauseCard h2 {
        margin: 0;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #d8f5e0;
      }
      .row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }
      .settings {
        display: none;
        flex-direction: column;
        gap: 14px;
        border-top: 1px solid rgba(150, 220, 165, 0.14);
        padding-top: 16px;
      }
      .settings.open {
        display: flex;
      }
      .field {
        display: grid;
        grid-template-columns: 132px 1fr 52px;
        align-items: center;
        gap: 12px;
        font-size: 13px;
        color: rgba(214, 240, 220, 0.86);
      }
      .field input[type='range'] {
        width: 100%;
        accent-color: #5fc27e;
      }
      .field select {
        grid-column: 2 / span 2;
        background: rgba(8, 20, 14, 0.9);
        color: #dff5e6;
        border: 1px solid rgba(150, 220, 165, 0.25);
        border-radius: 8px;
        padding: 7px 10px;
        font: inherit;
        font-size: 13px;
      }
      .note {
        display: none;
        font-size: 12px;
        color: #9df0b4;
        margin: -6px 0 0 144px;
      }
      .note.on {
        display: block;
      }
      .field .val {
        text-align: right;
        font-variant-numeric: tabular-nums;
        color: rgba(170, 215, 182, 0.8);
      }
      #updateRow {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        border-top: 1px solid rgba(150, 220, 165, 0.14);
        padding-top: 14px;
      }
      #updateStatus {
        font-size: 12px;
        letter-spacing: 0.05em;
        color: rgba(170, 210, 180, 0.72);
      }
      #updateStatus.available {
        color: #9df0b4;
      }
      #updateDot {
        display: none;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #7ef29b;
        box-shadow: 0 0 10px #7ef29b;
        margin-left: 6px;
      }
      #updateDot.on {
        display: inline-block;
      }

      /* Native window controls — only visible inside the pause menu. */
      #winControls {
        position: absolute;
        top: 14px;
        right: 16px;
        display: none;
        gap: 8px;
        /* Above the drag strip, so nothing can paint over the buttons. */
        z-index: 3;
      }
      #winControls.on {
        display: flex;
      }
      #winControls button {
        appearance: none;
        width: 34px;
        height: 30px;
        border-radius: 8px;
        border: 1px solid rgba(180, 220, 190, 0.2);
        background: rgba(255, 255, 255, 0.06);
        color: #dff2e4;
        font-size: 14px;
        line-height: 1;
        cursor: pointer;
      }
      #winControls button:hover {
        background: rgba(255, 255, 255, 0.14);
      }
      #winControls button.close:hover {
        background: #c0392b;
        border-color: #c0392b;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <div id="hud">
      <div id="stats"></div>
      <div id="crosshair"></div>
      <div id="hint" data-i18n="hud.hintDesktop">
        WASD · Shift sprint · Space jump · Scroll: 3rd person · F11 fullscreen · Esc menu
      </div>
    </div>

    <!-- Player list: hold Tab. Populated from the network session. -->
    <div id="players" aria-hidden="true">
      <div id="playersHead">
        <span data-i18n="players.title">Players</span>
        <span id="playersCount">0</span>
      </div>
      <div id="playersList"></div>
    </div>

    <!--
      The squad: who is with you and how far away, along the top of the screen where
      you are already looking when you are deciding where to go. Invitations arrive
      bottom-right, out of the way of both the view and the player list.
    -->
    <div id="squad" aria-hidden="true">
      <div id="squadList"></div>
    </div>
    <!--
      Build hotbar. Slots are generated in script from the piece list, so the bar
      and the pieces can never fall out of step.
    -->
    <!--
      Inventory, crafting and vitals. Three columns because they answer three
      questions; opened with I or by using a workbench.
    -->
    <div id="inventory">
      <div class="invWindow">
        <div class="invPane invYou">
          <div class="invHead">
            <span class="invTitle" id="invWho"></span>
          </div>
          <div class="invBody">
            <img id="invFace" alt="" hidden />
          </div>
        </div>
        <div class="invPane invBag">
          <div class="invHead">
            <span class="invTitle" data-i18n="inv.bag">Bag</span>
            <span id="invSlots" class="invSlots"></span>
          </div>
          <div id="invGrid"></div>
        </div>
        <div class="invPane invWide">
          <div class="invHead">
            <span class="invTitle" data-i18n="inv.craft">Crafting</span>
            <span id="invHint" class="invSlots"></span>
          </div>
          <div id="invRecipes"></div>
        </div>
        <div class="invPane invVitals">
          <div class="invMeterRow">
            <span class="invMeterLabel" aria-hidden="true">&#10010;</span>
            <span class="invMeter"
              ><span class="invMeterFill health" id="barHealth"></span
              ><span class="invMeterValue" id="valHealth"></span
            ></span>
          </div>
          <div class="invMeterRow">
            <span class="invMeterLabel" aria-hidden="true">&#128167;</span>
            <span class="invMeter"
              ><span class="invMeterFill water" id="barWater"></span
              ><span class="invMeterValue" id="valWater"></span
            ></span>
          </div>
          <div class="invMeterRow">
            <span class="invMeterLabel" aria-hidden="true">&#127831;</span>
            <span class="invMeter"
              ><span class="invMeterFill food" id="barFood"></span
              ><span class="invMeterValue" id="valFood"></span
            ></span>
          </div>
        </div>
      </div>
    </div>

    <!--
      Interaction prompt. Sits just under the crosshair. One label and one key, fed by
      the scene, because the scene is the only thing that knows what is in reach.
    -->
    <div id="interactHint" role="status" aria-live="polite" hidden></div>

    <div id="buildHud" hidden>
      <div id="buildCats" role="tablist" aria-label="Build groups"></div>
      <div id="buildLabel" role="status" aria-live="polite"></div>
      <div id="buildBar" role="toolbar" aria-label="Build pieces"></div>
      <div id="buildTip">
        <span id="buildHint"></span> <span id="buildCount">0</span>
        <span id="buildAim"></span>
      </div>
    </div>

    <!--
      Squad name tags. Positioned per frame from a world-to-screen projection, so
      this layer must not lay anything out itself or take the pointer.
    -->
    <div id="squadTags" aria-hidden="true"></div>

    <div id="squadInvites" role="status" aria-live="polite"></div>

    <!--
      Where you are (F3), and which way a typed coordinate is.
      The compass sits at the top centre because that is where you look when you are
      deciding which way to walk; the readout sits low so it does not cover the view.
    -->
    <div id="compass" aria-hidden="true">
      <div id="compassNeedle">▲</div>
      <div id="compassRange"></div>
    </div>
    <div id="coords" aria-hidden="true">
      <div id="coordsRead">X 0   Y 0   Z 0</div>
      <input
        id="coordsInput"
        type="text"
        maxlength="32"
        autocomplete="off"
        spellcheck="false"
        aria-label="Waypoint coordinates"
        placeholder="Go to: x z"
        data-i18n-placeholder="coords.goto"
      />
    </div>

    <!-- Admin panel: P. Only reachable by the holder of the reserved name. -->
    <div id="admin" aria-hidden="true">
      <div id="adminHead" data-i18n="admin.title">Admin</div>
      <div id="adminList"></div>
    </div>

    <div id="fade">
      <img id="fadeIcon" src="ui/transition.gif" alt="" aria-hidden="true" draggable="false" />
    </div>

    <!-- Pause / settings overlay (Escape) -->
    <div id="pause">
      <div id="pauseBlur"></div>
      <div class="dragStrip" data-tauri-drag-region></div>
      <div id="winControls">
        <button id="winMin" data-i18n-title="win.minimise" title="Minimise">&#8211;</button>
        <button id="winMax" data-i18n-title="win.maximise" title="Maximise">&#9633;</button>
        <button id="winClose" class="close" data-i18n-title="win.quit" title="Quit">&#10005;</button>
      </div>
      <div id="pauseCard" class="panel">
        <h2 data-i18n="pause.title">Paused</h2>
        <div class="row">
          <button id="btnResume" class="btn" data-i18n="pause.resume">Resume</button>
          <button id="btnSettings" class="btn ghost" data-i18n="pause.settings">Settings</button>
          <button id="btnFullscreen" class="btn ghost" data-i18n="pause.fullscreen">Fullscreen</button>
        </div>

        <div id="settings" class="settings">
          <div class="field">
            <label for="setSkin" data-i18n="set.character">Character</label>
            <select id="setSkin"></select>
          </div>
          <div id="skinNote" class="note"></div>
          <div class="field">
            <label for="setLang" data-i18n="set.language">Language</label>
            <select id="setLang">
              <option value="en">English</option>
              <option value="ru">Русский</option>
            </select>
          </div>
          <div class="field">
            <label for="setFps" data-i18n="set.fps">Frame rate</label>
            <select id="setFps">
              <option value="vsync" data-i18n="fps.vsync">Match display (smoothest)</option>
              <option value="60">60 FPS</option>
              <option value="120">120 FPS</option>
              <option value="144">144 FPS</option>
              <option value="240">240 FPS</option>
              <option value="unlimited" data-i18n="fps.unlimited">Unlimited (may tear)</option>
            </select>
          </div>
          <div id="fpsNote" class="note"></div>
          <div class="field">
            <label for="setQuality" data-i18n="set.quality">Quality</label>
            <select id="setQuality">
              <option value="low" data-i18n="quality.low">Low</option>
              <option value="medium" data-i18n="quality.medium">Medium</option>
              <option value="high" data-i18n="quality.high">High</option>
              <option value="ultra" data-i18n="quality.ultra">Ultra</option>
            </select>
          </div>
          <div class="field">
            <label for="setMusic" data-i18n="set.music">Music</label>
            <input id="setMusic" type="range" min="0" max="100" value="50" />
            <span class="val" id="valMusic">50%</span>
          </div>
          <div class="field">
            <label for="setSfx" data-i18n="set.sfx">Effects</label>
            <input id="setSfx" type="range" min="0" max="100" value="80" />
            <span class="val" id="valSfx">80%</span>
          </div>
          <div class="field">
            <label for="setSens" data-i18n="set.sensitivity">Sensitivity</label>
            <input id="setSens" type="range" min="20" max="300" value="100" />
            <span class="val" id="valSens">1.00</span>
          </div>
          <div class="field">
            <label for="setFov" data-i18n="set.fov">Field of view</label>
            <input id="setFov" type="range" min="60" max="110" value="68" />
            <span class="val" id="valFov">68</span>
          </div>
        </div>

        <div id="updateRow">
          <span id="updateStatus" data-i18n="upd.notChecked">Updates: not checked</span
          ><i id="updateDot"></i>
          <button id="btnUpdate" class="btn ghost" data-i18n="upd.check">Check for updates</button>
        </div>
      </div>
    </div>

    <!-- Start screen: shown before the world is revealed -->
    <div id="start">
      <!-- With no OS title bar, this strip is how the window gets dragged. -->
      <div class="dragStrip" data-tauri-drag-region></div>
      <div class="brand">Arena Nova</div>
      <div id="playRow">
        <div id="nameField">
          <input
            id="nameInput"
            type="text"
            maxlength="18"
            autocomplete="off"
            spellcheck="false"
            aria-label="Player name"
            placeholder="Your name"
            data-i18n-placeholder="start.name"
          />
        </div>
        <button id="btnPlay" class="btn big" disabled data-i18n="start.loading">Loading…</button>
        <div id="playSpinner" class="spinner" aria-hidden="true"></div>
      </div>
      <div id="nameNote" role="status" aria-live="polite"></div>
      <!--
        Admin password. Blank for almost everyone, so it is deliberately quiet and
        below the fold of attention rather than a second field competing with the
        name. `type="password"` matters here: this is the only credential the game
        has, and it should not be readable over a shoulder or in a screen recording.
      -->
      <div id="passField">
        <input
          id="passInput"
          type="password"
          maxlength="64"
          autocomplete="current-password"
          spellcheck="false"
          aria-label="Admin password"
          placeholder="Admin password (optional)"
          data-i18n-placeholder="start.pass"
        />
      </div>
      <div id="startHint" data-i18n="start.preparing">Preparing the ruins…</div>
      <div id="version"></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
